name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Bundle Offline 3D Engine
        run: |
          npm install
          mkdir -p www
          cp index.html style.css game.js www/
          cp node_modules/three/build/three.min.js www/three.min.js
          npx cap init "Apex Drive 3D" "com.vishal.apexdrive3d" --web-dir=www
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Drive-3D-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
